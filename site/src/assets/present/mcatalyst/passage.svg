<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Cholera toxin binds GM1, travels back to the ER, and its A subunit ADP-ribosylates Gs-alpha, raising cAMP, opening CFTR and inhibiting NHE3</title>
<rect width="640" height="330" fill="#fff"/>
<text x="20.0" y="18.0" font-size="12" text-anchor="start" font-weight="bold">Intestinal lumen</text>
<rect x="20" y="70" width="600" height="14" fill="#e6e6e6" stroke="#000" stroke-width="1"/>
<text x="24.0" y="101.0" font-size="10" text-anchor="start" font-weight="normal" font-style="italic">apical membrane</text>
<rect x="40" y="28" width="130" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="105.0" y="47.0" font-size="11" text-anchor="middle" font-weight="normal">cholera toxin</text>
<text x="178.0" y="47.0" font-size="10.5" text-anchor="start" font-weight="normal">binds GM1</text>
<line x1="105.0" y1="58.0" x2="105.0" y2="112.0" stroke="#000" stroke-width="1.3"/>
<path d="M105.0,120.0 L109.0,112.0 L101.0,112.0 Z" fill="#000"/>
<rect x="40" y="122" width="130" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="105.0" y="141.0" font-size="11" text-anchor="middle" font-weight="normal">endosome</text>
<line x1="105.0" y1="152.0" x2="105.0" y2="164.0" stroke="#000" stroke-width="1.3"/>
<path d="M105.0,172.0 L109.0,164.0 L101.0,164.0 Z" fill="#000"/>
<rect x="40" y="174" width="130" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="105.0" y="193.0" font-size="11" text-anchor="middle" font-weight="normal">Golgi</text>
<line x1="105.0" y1="204.0" x2="105.0" y2="216.0" stroke="#000" stroke-width="1.3"/>
<path d="M105.0,224.0 L109.0,216.0 L101.0,216.0 Z" fill="#000"/>
<rect x="40" y="226" width="130" height="40" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="105.0" y="243.5" font-size="11" text-anchor="middle" font-weight="normal">endoplasmic</text>
<text x="105.0" y="256.5" font-size="11" text-anchor="middle" font-weight="normal">reticulum</text>
<text x="200.0" y="238.0" font-size="10.5" text-anchor="middle" font-weight="normal">A subunit</text>
<line x1="170.0" y1="246.0" x2="228.0" y2="246.0" stroke="#000" stroke-width="1.3"/>
<path d="M236.0,246.0 L228.0,242.0 L228.0,250.0 Z" fill="#000"/>
<rect x="238" y="226" width="150" height="40" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="313.0" y="243.8" font-size="10.5" text-anchor="middle" font-weight="normal">A subunit ADP-</text>
<text x="313.0" y="256.2" font-size="10.5" text-anchor="middle" font-weight="normal">ribosylates Gαs</text>
<line x1="313.0" y1="226.0" x2="313.0" y2="214.0" stroke="#000" stroke-width="1.3"/>
<path d="M313.0,206.0 L309.0,214.0 L317.0,214.0 Z" fill="#000"/>
<rect x="238" y="174" width="150" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="313.0" y="193.0" font-size="10.5" text-anchor="middle" font-weight="normal">Gαs stays active</text>
<line x1="313.0" y1="174.0" x2="313.0" y2="162.0" stroke="#000" stroke-width="1.3"/>
<path d="M313.0,154.0 L309.0,162.0 L317.0,162.0 Z" fill="#000"/>
<rect x="238" y="122" width="150" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="313.0" y="141.0" font-size="10.5" text-anchor="middle" font-weight="normal">adenylyl cyclase</text>
<line x1="388.0" y1="137.0" x2="430.0" y2="137.0" stroke="#000" stroke-width="1.3"/>
<path d="M438.0,137.0 L430.0,133.0 L430.0,141.0 Z" fill="#000"/>
<rect x="440" y="122" width="80" height="30" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="480.0" y="141.0" font-size="11" text-anchor="middle" font-weight="normal">cAMP ↑</text>
<line x1="470.0" y1="122.0" x2="470.0" y2="98.0" stroke="#000" stroke-width="1.3"/>
<path d="M470.0,90.0 L466.0,98.0 L474.0,98.0 Z" fill="#000"/>
<rect x="436" y="66" width="68" height="22" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="470.0" y="81.0" font-size="10.5" text-anchor="middle" font-weight="normal">CFTR</text>
<text x="470.0" y="56.0" font-size="10.5" text-anchor="middle" font-weight="normal">Cl⁻ secreted</text>
<path d="M520,137 H572 V94" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M564,92 H580" stroke="#000" stroke-width="2"/>
<rect x="540" y="66" width="68" height="22" rx="6" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="574.0" y="81.0" font-size="10.5" text-anchor="middle" font-weight="normal">NHE3</text>
<text x="574.0" y="40.0" font-size="10.5" text-anchor="middle" font-weight="normal">Na⁺ absorption</text>
<text x="574.0" y="54.0" font-size="10.5" text-anchor="middle" font-weight="normal">blocked</text>
<path d="M20,290 H620" stroke="#000" stroke-width="1"/>
<text x="320.0" y="314.0" font-size="11.5" text-anchor="middle" font-weight="bold">Water follows the secreted Cl⁻ into the lumen: secretory diarrhea</text>
<text x="620.0" y="284.0" font-size="10" text-anchor="end" font-weight="normal" font-style="italic">inside the epithelial cell</text>
</svg>
